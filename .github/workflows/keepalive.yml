name: Keep backend warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DevPilot health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            https://devpilot-api-ljyh.onrender.com/api/health
