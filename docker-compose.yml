services:
  postgres:
    image: postgres:16-alpine
    container_name: devpilot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot_secret
      POSTGRES_DB: devpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    container_name: devpilot-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/devpilot_secret
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
