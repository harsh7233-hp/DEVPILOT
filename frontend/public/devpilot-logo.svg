<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DevPilot Logo</title>
  <desc id="desc">Green gradient developer code logo on a transparent background.</desc>
  <defs>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7FF3C"/>
      <stop offset="52%" stop-color="#66D45D"/>
      <stop offset="100%" stop-color="#19A879"/>
    </linearGradient>
    <linearGradient id="greenDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63D86A"/>
      <stop offset="100%" stop-color="#078B70"/>
    </linearGradient>
  </defs>

  <!-- Main circular/code-pilot mark -->
  <path fill="url(#green)" d="
    M395 218
    H626
    C790 218 891 310 891 463
    C891 618 793 730 632 730
    H500
    L434 797
    H637
    C834 797 949 671 949 464
    C949 266 824 160 628 160
    H395
    C395 181 397 201 395 218 Z"/>

  <!-- Subtle darker lower-right section -->
  <path fill="url(#greenDark)" opacity=".72" d="
    M691 730
    C792 705 850 605 850 481
    C850 378 798 299 702 268
    C798 311 844 382 844 480
    C844 590 788 689 691 730 Z"/>

  <!-- Left code/list marks -->
  <g fill="url(#green)">
    <circle cx="177" cy="348" r="22"/>
    <rect x="221" y="326" width="213" height="44" rx="22"/>
    <rect x="254" y="411" width="164" height="39" rx="19.5"/>

    <circle cx="177" cy="522" r="22"/>
    <rect x="214" y="500" width="220" height="44" rx="22"/>
    <rect x="284" y="589" width="145" height="39" rx="19.5"/>

    <circle cx="255" cy="674" r="20"/>
    <rect x="292" y="654" width="137" height="40" rx="20"/>
  </g>

  <!-- Code brackets -->
  <g fill="none" stroke="url(#green)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M552 445 L505 487 L552 529"/>
    <path d="M671 445 L718 487 L671 529"/>
    <path d="M625 407 L584 567"/>
  </g>
</svg>
